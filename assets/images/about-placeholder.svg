<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 900">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0a0e17"/>
      <stop offset="1" stop-color="#141225"/>
    </linearGradient>
    <linearGradient id="scan" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#ff2fb9" stop-opacity="0.15"/>
      <stop offset="1" stop-color="#2de2e6" stop-opacity="0.15"/>
    </linearGradient>
  </defs>
  <rect width="800" height="900" fill="url(#bg)"/>
  <g stroke="#2de2e6" stroke-opacity="0.15" stroke-width="1">
    <path d="M0 100 H800 M0 200 H800 M0 300 H800 M0 400 H800 M0 500 H800 M0 600 H800 M0 700 H800 M0 800 H800"/>
    <path d="M100 0 V900 M200 0 V900 M300 0 V900 M400 0 V900 M500 0 V900 M600 0 V900 M700 0 V900"/>
  </g>
  <rect x="0" y="0" width="800" height="900" fill="url(#scan)"/>
  <g fill="none" stroke="#ff2fb9" stroke-width="3">
    <rect x="260" y="300" width="280" height="280" rx="8"/>
  </g>
  <g fill="#9dfc4a" font-family="monospace" font-size="20" opacity="0.8">
    <text x="400" y="450" text-anchor="middle">PORTRAIT</text>
    <text x="400" y="480" text-anchor="middle">// upload photo</text>
  </g>
